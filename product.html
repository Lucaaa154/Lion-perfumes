                        </div>
                    </div>
                    
                    <div class="flex gap-4 pt-4">
                        ${currentProduct.soldOut ? `
                        <button disabled class="flex-1 bg-red-900/30 border-2 border-red-500/50 text-red-400 font-bold py-4 px-8 rounded-xl cursor-not-allowed flex items-center justify-center gap-2">
                            <i data-lucide="package-x" class="w-5 h-5"></i>
                            אזל מהמלאי
                        </button>
                        ` : `
                        <button onclick="addToCart(${currentProduct.id})" 
                                class="flex-1 bg-gold-400 hover:bg-gold-500 text-dark-900 font-bold py-4 px-8 rounded-xl transition-all transform hover:scale-105 flex items-center justify-center gap-2 shadow-lg shadow-gold-400/20">
                            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                            הוסף לעגלה
                        </button>
                        `}
                        
                        <a href="https://wa.me/972543102706?text=היי!%20אני%20מתעניין%20בבושם%20${encodeURIComponent(currentProduct.name)}" 
                           target="_blank"
                           class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-8 rounded-xl transition-all transform hover:scale-105 flex items-center justify-center gap-2 shadow-lg shadow-green-600/20">
                            <i data-lucide="message-circle" class="w-5 h-5"></i>
                            שאל בוואטסאפ
                        </a>
                    </div>
                    
                    
                </div>
            `;
            
            lucide.createIcons();
            initSwipeDetection();
        }

        function setImage(index) {
            currentImageIndex = index;
            const mainImage = document.getElementById('main-image');
            const counter = document.getElementById('image-counter');
            
            if (mainImage) {
                mainImage.src = currentProduct.images[index];
            }
            if (counter) {
                counter.textContent = index + 1;
            }
            
            // Update thumbnails
            document.querySelectorAll('.thumbnail').forEach((thumb, idx) => {
                if (idx === index) {
                    thumb.classList.add('active');
                } else {
                    thumb.classList.remove('active');
                }
            });
        }

        function nextImage() {
            if (!currentProduct || currentProduct.images.length <= 1) return;
            const next = (currentImageIndex + 1) % currentProduct.images.length;
            setImage(next);
        }

        function prevImage() {
            if (!currentProduct || currentProduct.images.length <= 1) return;
            const prev = (currentImageIndex - 1 + currentProduct.images.length) % currentProduct.images.length;
            setImage(prev);
        }

        // Swipe detection for mobile image gallery
        let touchStartX = 0;
        let touchStartY = 0;

        function initSwipeDetection() {
            const container = document.getElementById('product-image-container');
            if (!container) return;

            container.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            container.addEventListener('touchend', function(e) {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                const minSwipeDistance = 50;

                // Only trigger if horizontal swipe is significant and more horizontal than vertical
                if (Math.abs(deltaX) > minSwipeDistance && Math.abs(deltaX) > Math.abs(deltaY)) {
                    if (deltaX < 0) {
                        // Swiped left → next image
                        nextImage();
                    } else {
                        // Swiped right → previous image
                        prevImage();
                    }
                }
            }, { passive: true });
        }

        // Cart Functions (same as index.html)
        function addToCart(id) {
            const perfume = perfumes.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...perfume, quantity: 1 });
            }
            
            saveCart();
            updateCartUI();
            showToast(`הוסף לעגלה: ${perfume.name}`);
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            updateCartUI();
        }

        function updateQuantity(id, change) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(id);
                } else {
                    saveCart();
                    updateCartUI();
                }
            }
        }

        function clearCart() {
            if (confirm('האם אתה בטוח שברצונך לרוקן את העגלה?')) {
                cart = [];
                payMoreAmount = 0;
                document.getElementById('pay-more-input').value = '';
                saveCart();
                updateCartUI();
            }
        }

        function updatePayMore() {
            const input = document.getElementById('pay-more-input');
            const value = parseFloat(input.value) || 0;
            payMoreAmount = value >= 0 ? value : 0;
            updateCartTotals();
        }

        function updateCartTotals() {
            const subtotal = cart.reduce((sum, item) => sum + ((item.salePrice || item.price) * item.quantity), 0);
            const total = subtotal + payMoreAmount;
            
            document.getElementById('cart-subtotal').textContent = `₪${subtotal}`;
            document.getElementById('cart-total').textContent = `₪${total}`;
            
            if (payMoreAmount > 0) {
                document.getElementById('cart-total').classList.add('text-gold-400');
                document.getElementById('cart-total').classList.remove('text-white');
            } else {
                document.getElementById('cart-total').classList.remove('text-gold-400');
                document.getElementById('cart-total').classList.add('text-white');
            }
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            const cartFooter = document.getElementById('cart-footer');
            const cartCount = document.getElementById('cart-count');
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="text-gray-400 text-center py-8">העגלה שלך ריקה</p>';
                cartFooter.classList.add('hidden');
                cartCount.classList.add('hidden');
                payMoreAmount = 0;
                document.getElementById('pay-more-input').value = '';
            } else {
                cartCount.textContent = totalItems;
                cartCount.classList.remove('hidden');
                
                cartItems.innerHTML = cart.map(item => `
                    <div class="flex gap-3 bg-dark-900 p-3 rounded-lg border border-gold-400/10">
                        <img src="${item.images[0]}" class="w-16 h-16 object-cover rounded" onerror="this.src='https://static.photos/luxury/640x360/999'">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm text-white mb-1">${item.name}</h4>
                            <div class="text-gold-400 text-sm mb-2">${item.salePrice ? '₪' + item.salePrice + ' <span class="text-red-500 line-through text-xs">₪' + item.price + '</span>' : '₪' + item.price}</div>
                            <div class="flex items-center gap-2">
                                <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 rounded-full bg-dark-700 hover:bg-dark-600 flex items-center justify-center text-xs transition-colors">-</button>
                                <span class="text-sm w-4 text-center">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 rounded-full bg-dark-700 hover:bg-dark-600 flex items-center justify-center text-xs transition-colors">+</button>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-400 self-start">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `).join('');
                
                updateCartTotals();
                cartFooter.classList.remove('hidden');
                
                lucide.createIcons();
            }
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            const isOpen = sidebar.classList.contains('open');
            
            if (isOpen) {
                closeCart();
            } else {
                openCart();
            }
        }

        function closeCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            sidebar.classList.remove('open');
            overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function openCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            sidebar.classList.add('open');
            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            updateCartUI();
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) return;
            
            let message = "היי! אשמח להזמין את הבשמים הבאים:\n\n";
            let subtotal = 0;
            
            cart.forEach(item => {
                message += `• ${item.name} (${item.brand}) - כמות: ${item.quantity} - מחיר: ₪${(item.salePrice || item.price) * item.quantity}\n`;
                subtotal += (item.salePrice || item.price) * item.quantity;
            });
            
            message += `\nסכום מוצרים: ₪${subtotal}`;
            
            if (payMoreAmount > 0) {
                message += `\n+ תוספת/טיפ: ₪${payMoreAmount}`;
            }
            
            const total = subtotal + payMoreAmount;
            message += `\nסכום כולל: ₪${total}\n\nתודה רבה! ‎🦁`;
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = "https://api.whatsapp.com/send?phone=972543102706&text=" + encodedMessage;
            window.open(whatsappUrl, '_blank');
        }

        function saveCart() {
            localStorage.setItem('lionPerfumesCart', JSON.stringify(cart));
            localStorage.setItem('lionPerfumesPayMore', payMoreAmount.toString());
        }

        function loadCart() {
            const saved = localStorage.getItem('lionPerfumesCart');
            const savedPayMore = localStorage.getItem('lionPerfumesPayMore');
            
            if (saved && saved !== 'null' && saved !== 'undefined') {
                try {
                    cart = JSON.parse(saved);
                } catch (e) {
                    cart = [];
                }
            }
            
            if (savedPayMore && savedPayMore !== 'null') {
                payMoreAmount = parseFloat(savedPayMore) || 0;
                document.getElementById('pay-more-input').value = payMoreAmount > 0 ? payMoreAmount : '';
            }
            
            updateCartUI();
        }

        function toggleProductDescription() {
            const shortDesc = document.getElementById('desc-short');
            const fullDesc = document.getElementById('desc-full');
            const btnText = document.querySelector('#desc-toggle-btn span');
            const btnIcon = document.querySelector('#desc-toggle-btn i');
            
            if (fullDesc.classList.contains('hidden')) {
                fullDesc.classList.remove('hidden');
                shortDesc.classList.add('hidden');
                btnText.textContent = 'הצג פחות';
                btnIcon.style.transform = 'rotate(180deg)';
            } else {
                fullDesc.classList.add('hidden');
                shortDesc.classList.remove('hidden');
                btnText.textContent = 'קרא עוד';
                btnIcon.style.transform = 'rotate(0deg)';
            }
            
            // Re-initialize icons for the chevron if needed
            lucide.createIcons();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Close cart on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('cart-sidebar');
                if (sidebar.classList.contains('open')) {
                    closeCart();
                }
            }
        });
    </script>
</body>
