<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion Perfumes - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Heebo', sans-serif; }
        .gold { color: #D4AF37; }
        .gold-bg { background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%); }
        .dark-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; }
        input, select, textarea { background: #111 !important; border: 1px solid #3a3a3a !important; color: white !important; border-radius: 8px; padding: 10px 14px; width: 100%; font-family: 'Heebo', sans-serif; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #D4AF37 !important; }
        select option { background: #1a1a1a; }
        label { display: block; color: #D4AF37; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
        .tab { padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 14px; border: 1px solid #2a2a2a; color: #888; background: none; font-family: 'Heebo', sans-serif; }
        .tab.active { background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%); color: #000; border-color: #D4AF37; }
        .perfume-card { background: #111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
        .perfume-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #D4AF37; flex-shrink: 0; }
        .btn-edit { background: #1a2a1a; border: 1px solid #2a6a2a; color: #4ade80; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; font-family: 'Heebo', sans-serif; }
        .btn-delete { background: #2a1a1a; border: 1px solid #6a2a2a; color: #f87171; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; font-family: 'Heebo', sans-serif; }
        .btn-gold { background: linear-gradient(135deg, #D4AF37 0%, #B8960C 100%); color: #000; font-weight: 700; border: none; border-radius: 12px; padding: 14px; width: 100%; font-size: 16px; cursor: pointer; font-family: 'Heebo', sans-serif; }
        .btn-secondary { background: #1a1a1a; color: #888; border: 1px solid #3a3a3a; border-radius: 12px; padding: 14px; width: 100%; font-size: 15px; cursor: pointer; font-family: 'Heebo', sans-serif; margin-top: 8px; }
        .status-box { border-radius: 10px; padding: 14px; margin-top: 12px; font-size: 14px; }
        .status-success { background: #0f2a1a; border: 1px solid #2a6a3a; color: #4ade80; }
        .status-error { background: #2a0f0f; border: 1px solid #6a2a2a; color: #f87171; }
        .status-loading { background: #1a1a2a; border: 1px solid #2a2a6a; color: #93c5fd; }
        .img-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .img-row input { flex: 1; }
        .remove-btn { background: #2a0f0f; border: 1px solid #6a2a2a; color: #f87171; border-radius: 8px; padding: 0 12px; cursor: pointer; font-size: 18px; flex-shrink: 0; }
        .soldout-badge { background: #6a2a2a; color: #f87171; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 100; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal { background: #1a1a1a; border: 1px solid #D4AF37; border-radius: 16px; padding: 20px; max-width: 500px; margin: 0 auto; }
        .upload-area { border: 2px dashed #3a3a3a; border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; }
        .upload-area:hover { border-color: #D4AF37; }
    </style>
</head>
<body class="min-h-screen">
    <div class="text-center pt-6 pb-4 px-4">
        <h1 class="text-2xl font-bold gold">LION PERFUMES</h1>
        <p class="text-gray-500 text-sm mt-1">פאנל ניהול</p>
    </div>

    <div class="flex gap-2 px-4 mb-4 overflow-x-auto pb-1">
        <button class="tab active" onclick="switchTab('add')" id="tab-add">הוסף בושם</button>
        <button class="tab" onclick="switchTab('list')" id="tab-list">כל הבשמים</button>
    </div>

    <div class="px-4 pb-10 max-w-lg mx-auto">

        <!-- ADD TAB -->
        <div id="panel-add">
            <div class="dark-card p-5">
                <h2 class="text-lg font-bold gold mb-4">הוספת בושם חדש</h2>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div><label>שם הבושם *</label><input type="text" id="add-name" placeholder="Jean Lowe Verde Aura"></div>
                    <div><label>מותג *</label><input type="text" id="add-brand" placeholder="Maison Alhambra"></div>
                </div>
                <div class="grid grid-cols-3 gap-3 mb-3">
                    <div><label>מחיר (₪) *</label><input type="number" id="add-price" placeholder="139"></div>
                    <div><label>גודל</label><input type="text" id="add-size" value="100ml"></div>
                    <div><label>ID</label><input type="number" id="add-id" value="102"></div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div><label>עונה</label>
                        <select id="add-season">
                            <option value="summer">קיץ</option>
                            <option value="winter">חורף</option>
                            <option value="joker" selected>ג'וקר</option>
                        </select>
                    </div>
                    <div><label>מגדר</label>
                        <select id="add-gender">
                            <option value="male">גברים</option>
                            <option value="female">נשים</option>
                            <option value="unisex">יוניסקס</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-3 mb-3 p-3 rounded-lg" style="background:#111;border:1px solid #2a2a2a;">
                    <input type="checkbox" id="add-soldout" style="width:18px;height:18px;accent-color:#D4AF37;flex-shrink:0;">
                    <label for="add-soldout" style="color:white;margin:0;cursor:pointer;">אזל מהמלאי</label>
                </div>
                <div class="mb-3">
                    <label>תמונות</label>
                    <div class="upload-area mb-2" onclick="document.getElementById('add-img-upload').click()">
                        <input type="file" id="add-img-upload" accept="image/*" multiple style="display:none" onchange="handleUpload(event,'add')">
                        <p class="text-gray-400 text-sm">העלה תמונות מהטלפון</p>
                    </div>
                    <div id="add-img-previews" class="flex flex-wrap gap-2 mb-2"></div>
                    <div id="add-img-urls"></div>
                    <button onclick="addUrlField('add')" style="background:none;border:1px dashed #3a3a3a;color:#888;border-radius:8px;padding:8px;width:100%;cursor:pointer;font-size:13px;font-family:'Heebo',sans-serif;">+ הוסף לינק תמונה</button>
                </div>
                <div class="mb-4"><label>תיאור</label><textarea id="add-desc" rows="4" placeholder="תיאור הבושם..."></textarea></div>
                <button class="btn-gold" onclick="addPerfume()">הוסף בושם לאתר</button>
                <div id="add-status" style="display:none;"></div>
            </div>
        </div>

        <!-- LIST TAB -->
        <div id="panel-list" style="display:none;">
            <input type="text" id="search-box" placeholder="חפש בושם..." oninput="renderList()" style="margin-bottom:14px;">
            <div id="perfumes-list"><div class="text-center text-gray-500 py-8">טוען...</div></div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="edit-modal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h2 class="text-lg font-bold gold mb-4">עריכת בושם</h2>
            <input type="hidden" id="edit-original-id">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div><label>שם</label><input type="text" id="edit-name"></div>
                <div><label>מותג</label><input type="text" id="edit-brand"></div>
            </div>
            <div class="grid grid-cols-3 gap-3 mb-3">
                <div><label>מחיר</label><input type="number" id="edit-price"></div>
                <div><label>גודל</label><input type="text" id="edit-size"></div>
                <div><label>ID</label><input type="number" id="edit-id"></div>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div><label>עונה</label>
                    <select id="edit-season">
                        <option value="summer">קיץ</option>
                        <option value="winter">חורף</option>
                        <option value="joker">ג'וקר</option>
                    </select>
                </div>
                <div><label>מגדר</label>
                    <select id="edit-gender">
                        <option value="male">גברים</option>
                        <option value="female">נשים</option>
                        <option value="unisex">יוניסקס</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center gap-3 mb-3 p-3 rounded-lg" style="background:#111;border:1px solid #2a2a2a;">
                <input type="checkbox" id="edit-soldout" style="width:18px;height:18px;accent-color:#D4AF37;flex-shrink:0;">
                <label for="edit-soldout" style="color:white;margin:0;cursor:pointer;">אזל מהמלאי</label>
            </div>
            <div class="mb-3"><label>תמונות (לינק אחד לכל שורה)</label><textarea id="edit-images" rows="3"></textarea></div>
            <div class="mb-4"><label>תיאור</label><textarea id="edit-desc" rows="4"></textarea></div>
            <button class="btn-gold" onclick="saveEdit()">שמור שינויים</button>
            <button class="btn-secondary" onclick="closeModal()">ביטול</button>
            <div id="edit-status" style="display:none;"></div>
        </div>
    </div>

    <!-- DELETE MODAL -->
    <div id="delete-modal" class="modal-overlay" style="display:none;">
        <div class="modal text-center">
            <p class="text-4xl mb-4">🗑️</p>
            <h2 class="text-lg font-bold mb-2">למחוק את הבושם?</h2>
            <p class="text-gray-400 text-sm mb-6" id="delete-name-display"></p>
            <button class="btn-gold" style="background:linear-gradient(135deg,#c0392b,#922b21);margin-bottom:8px;" onclick="confirmDelete()">כן, מחק</button>
            <button class="btn-secondary" onclick="closeDeleteModal()">ביטול</button>
            <div id="delete-status" style="display:none;"></div>
        </div>
    </div>

<script>
const GITHUB_TOKEN = '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';
const GITHUB_REPO = 'Lucaaa154/Lion-perfumes';
const FILE_PATH = 'index.html';
let allPerfumes = [];
let uploadedImages = { add: [] };
let deleteTargetId = null;
let currentFileContent = '';
let currentFileSha = '';

function switchTab(tab) {
    document.getElementById('panel-add').style.display = tab === 'add' ? 'block' : 'none';
    document.getElementById('panel-list').style.display = tab === 'list' ? 'block' : 'none';
    document.getElementById('tab-add').className = 'tab' + (tab === 'add' ? ' active' : '');
    document.getElementById('tab-list').className = 'tab' + (tab === 'list' ? ' active' : '');
    if (tab === 'list') loadPerfumes();
}

function showStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.style.display = 'block';
    el.className = 'status-box status-' + type;
    el.innerHTML = msg;
}

function addUrlField(prefix) {
    const container = document.getElementById(prefix + '-img-urls');
    const row = document.createElement('div');
    row.className = 'img-row';
    row.innerHTML = '<input type="text" placeholder="https://..."><button class="remove-btn" onclick="this.parentElement.remove()">×</button>';
    container.appendChild(row);
}

async function handleUpload(event, prefix) {
    const files = Array.from(event.target.files);
    const previews = document.getElementById(prefix + '-img-previews');
    if (!uploadedImages[prefix]) uploadedImages[prefix] = [];
    for (const file of files) {
        await new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result;
                const fileName = 'images/' + Date.now() + '_' + file.name.replace(/\s/g, '_');
                uploadedImages[prefix].push({ data: base64.split(',')[1], fileName });
                const img = document.createElement('img');
                img.src = base64;
                img.style.cssText = 'width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid #D4AF37;';
                previews.appendChild(img);
                resolve();
            };
            reader.readAsDataURL(file);
        });
    }
}

async function uploadImageToGithub(data, fileName) {
    const res = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + fileName, {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + GITHUB_TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'Add image', content: data })
    });
    const json = await res.json();
    return json.content.download_url;
}

async function getFile() {
    const res = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILE_PATH, {
        headers: { 'Authorization': 'token ' + GITHUB_TOKEN }
    });
    const data = await res.json();
    currentFileSha = data.sha;
    currentFileContent = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    return currentFileContent;
}

async function pushFile(content, message) {
    const encoded = btoa(unescape(encodeURIComponent(content)));
    const res = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILE_PATH, {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + GITHUB_TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, content: encoded, sha: currentFileSha })
    });
    return await res.json();
}

function parsePerfumes(html) {
    const arr = [];
    const match = html.match(/const perfumes = \[([\s\S]*?)\];\s*\n/);
    if (!match) return arr;
    const block = match[1];
    const regex = /\{\s*id:\s*(\d+),[\s\S]*?size:\s*"([^"]*)"\s*\}/g;
    let m;
    while ((m = regex.exec(block)) !== null) {
        const entry = m[0];
        const id = parseInt((entry.match(/id:\s*(\d+)/) || [])[1]);
        const name = (entry.match(/name:\s*"((?:[^"\\]|\\.)*)"/) || [])[1] || '';
        const brand = (entry.match(/brand:\s*"((?:[^"\\]|\\.)*)"/) || [])[1] || '';
        const price = parseInt((entry.match(/price:\s*(\d+)/) || [])[1]) || 0;
        const season = (entry.match(/season:\s*"(\w+)"/) || [])[1] || 'joker';
        const gender = (entry.match(/gender:\s*"(\w+)"/) || [])[1] || 'male';
        const size = (entry.match(/size:\s*"([^"]+)"/) || [])[1] || '100ml';
        const soldOut = /soldOut:\s*true/.test(entry);
        const desc = (entry.match(/description:\s*"((?:[^"\\]|\\.)*)"/) || [])[1] || '';
        const imgMatches = [...entry.matchAll(/"(https?:\/\/[^"]+)"/g)].map(x => x[1]);
        if (id && name) arr.push({ id, name, brand, price, season, gender, size, soldOut, description: desc, images: imgMatches });
    }
    return arr;
}

async function loadPerfumes() {
    document.getElementById('perfumes-list').innerHTML = '<div class="text-center text-gray-500 py-8">טוען...</div>';
    try {
        const html = await getFile();
        allPerfumes = parsePerfumes(html);
        renderList();
    } catch(e) {
        document.getElementById('perfumes-list').innerHTML = '<div class="text-center text-red-400 py-8">שגיאה בטעינה</div>';
    }
}

function renderList() {
    const search = (document.getElementById('search-box').value || '').toLowerCase();
    const filtered = allPerfumes.filter(p => p.name.toLowerCase().includes(search) || (p.brand || '').toLowerCase().includes(search));
    const container = document.getElementById('perfumes-list');
    if (filtered.length === 0) { container.innerHTML = '<div class="text-center text-gray-500 py-8">לא נמצאו בשמים</div>'; return; }
    container.innerHTML = filtered.map(p => `
        <div class="perfume-card">
            <img src="${p.images && p.images[0] ? p.images[0] : ''}" onerror="this.style.display='none'">
            <div style="flex:1;min-width:0;">
                <div style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.soldOut ? '<span class="soldout-badge">אזל</span>' : ''}${p.name}</div>
                <div style="color:#D4AF37;font-size:12px;">${p.brand || ''}</div>
                <div style="color:#888;font-size:12px;">₪${p.price} · ${p.size || '100ml'}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
                <button class="btn-edit" onclick="openEdit(${p.id})">✏️ ערוך</button>
                <button class="btn-delete" onclick="openDelete(${p.id},'${p.name.replace(/'/g, "\\'")}')">🗑️ מחק</button>
            </div>
        </div>
    `).join('');
}

function openEdit(id) {
    const p = allPerfumes.find(x => x.id === id);
    if (!p) return;
    document.getElementById('edit-original-id').value = id;
    document.getElementById('edit-name').value = p.name || '';
    document.getElementById('edit-brand').value = p.brand || '';
    document.getElementById('edit-price').value = p.price || '';
    document.getElementById('edit-size').value = p.size || '100ml';
    document.getElementById('edit-id').value = p.id || '';
    document.getElementById('edit-season').value = p.season || 'joker';
    document.getElementById('edit-gender').value = p.gender || 'male';
    document.getElementById('edit-soldout').checked = p.soldOut || false;
    document.getElementById('edit-images').value = (p.images || []).join('\n');
    document.getElementById('edit-desc').value = (p.description || '').replace(/\\n/g, '\n');
    document.getElementById('edit-status').style.display = 'none';
    document.getElementById('edit-modal').style.display = 'block';
}

function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

async function saveEdit() {
    showStatus('edit-status', 'שומר שינויים...', 'loading');
    try {
        const originalId = parseInt(document.getElementById('edit-original-id').value);
        const name = document.getElementById('edit-name').value.trim();
        const brand = document.getElementById('edit-brand').value.trim();
        const price = document.getElementById('edit-price').value.trim();
        const size = document.getElementById('edit-size').value.trim() || '100ml';
        const newId = document.getElementById('edit-id').value.trim();
        const season = document.getElementById('edit-season').value;
        const gender = document.getElementById('edit-gender').value;
        const soldOut = document.getElementById('edit-soldout').checked;
        const images = document.getElementById('edit-images').value.trim().split('\n').filter(Boolean);
        const desc = document.getElementById('edit-desc').value.trim();
        const html = await getFile();
        const imagesStr = images.map(url => '                    "' + url.trim() + '"').join(',\n');
        const soldOutStr = soldOut ? '\n                soldOut: true,' : '';
        const descEscaped = desc.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
        const newBlock = '{\n                id: ' + newId + ',\n                name: "' + name + '",\n                brand: "' + brand + '",\n                price: ' + price + ',\n                season: "' + season + '",\n                gender: "' + gender + '",' + soldOutStr + '\n                images: [\n' + imagesStr + '\n                ],\n                description: "' + descEscaped + '",\n                size: "' + size + '"\n            }';
        const idPattern = new RegExp('\\{[^{}]*id:\\s*' + originalId + '[\\s\\S]*?size:\\s*"[^"]*"\\s*\\}', 's');
        const newContent = html.replace(idPattern, newBlock);
        if (newContent === html) { showStatus('edit-status', 'שגיאה: לא נמצא הבושם בקובץ', 'error'); return; }
        await pushFile(newContent, 'Edit perfume: ' + name);
        showStatus('edit-status', 'נשמר! האתר יתעדכן תוך 30 שניות', 'success');
        allPerfumes = parsePerfumes(newContent);
        currentFileContent = newContent;
        renderList();
    } catch(e) { showStatus('edit-status', 'שגיאה: ' + e.message, 'error'); }
}

function openDelete(id, name) {
    deleteTargetId = id;
    document.getElementById('delete-name-display').textContent = name;
    document.getElementById('delete-status').style.display = 'none';
    document.getElementById('delete-modal').style.display = 'block';
}

function closeDeleteModal() { document.getElementById('delete-modal').style.display = 'none'; deleteTargetId = null; }

async function confirmDelete() {
    showStatus('delete-status', 'מוחק...', 'loading');
    try {
        const html = await getFile();
        const idPattern = new RegExp('\\s*\\{[^{}]*id:\\s*' + deleteTargetId + '[\\s\\S]*?size:\\s*"[^"]*"\\s*\\},?', 's');
        const newContent = html.replace(idPattern, '');
        if (newContent === html) { showStatus('delete-status', 'שגיאה: לא נמצא הבושם', 'error'); return; }
        await pushFile(newContent, 'Delete perfume ID: ' + deleteTargetId);
        showStatus('delete-status', 'נמחק! האתר יתעדכן תוך 30 שניות', 'success');
        allPerfumes = allPerfumes.filter(p => p.id !== deleteTargetId);
        currentFileContent = newContent;
        renderList();
        setTimeout(closeDeleteModal, 2000);
    } catch(e) { showStatus('delete-status', 'שגיאה: ' + e.message, 'error'); }
}

async function addPerfume() {
    const name = document.getElementById('add-name').value.trim();
    const brand = document.getElementById('add-brand').value.trim();
    const price = document.getElementById('add-price').value.trim();
    const size = document.getElementById('add-size').value.trim() || '100ml';
    const id = document.getElementById('add-id').value.trim() || '102';
    const season = document.getElementById('add-season').value;
    const gender = document.getElementById('add-gender').value;
    const soldOut = document.getElementById('add-soldout').checked;
    const desc = document.getElementById('add-desc').value.trim();
    if (!name || !brand || !price) { showStatus('add-status', 'נא למלא שם, מותג ומחיר', 'error'); return; }
    showStatus('add-status', 'מעלה תמונות...', 'loading');
    let imageUrls = [];
    for (const img of (uploadedImages.add || [])) {
        try { imageUrls.push(await uploadImageToGithub(img.data, img.fileName)); }
        catch(e) { showStatus('add-status', 'שגיאה בהעלאת תמונה', 'error'); return; }
    }
    document.querySelectorAll('#add-img-urls input').forEach(i => { if (i.value.trim()) imageUrls.push(i.value.trim()); });
    if (imageUrls.length === 0) { showStatus('add-status', 'נא להוסיף לפחות תמונה אחת', 'error'); return; }
    showStatus('add-status', 'מעדכן את האתר...', 'loading');
    try {
        const html = await getFile();
        const imagesStr = imageUrls.map(url => '                    "' + url + '"').join(',\n');
        const soldOutStr = soldOut ? '\n                soldOut: true,' : '';
        const descEscaped = desc.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
        const newPerfume = '\n            {\n                id: ' + id + ',\n                name: "' + name + '",\n                brand: "' + brand + '",\n                price: ' + price + ',\n                season: "' + season + '",\n                gender: "' + gender + '",' + soldOutStr + '\n                images: [\n' + imagesStr + '\n                ],\n                description: "' + descEscaped + '",\n                size: "' + size + '"\n            },';
        const insertAfter = 'const perfumes = [';
        const insertPos = html.indexOf(insertAfter) + insertAfter.length;
        const newContent = html.slice(0, insertPos) + newPerfume + html.slice(insertPos);
        await pushFile(newContent, 'Add perfume: ' + name);
        showStatus('add-status', 'הבושם ' + name + ' נוסף! האתר יתעדכן תוך 30 שניות', 'success');
        document.getElementById('add-name').value = '';
        document.getElementById('add-brand').value = '';
        document.getElementById('add-price').value = '';
        document.getElementById('add-desc').value = '';
        document.getElementById('add-soldout').checked = false;
        document.getElementById('add-img-previews').innerHTML = '';
        document.getElementById('add-img-urls').innerHTML = '';
        document.getElementById('add-id').value = parseInt(id) + 1;
        uploadedImages.add = [];
    } catch(e) { showStatus('add-status', 'שגיאה: ' + e.message, 'error'); }
}
</script>
